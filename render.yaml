services:
  - type: web
    name: processum
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: node --experimental-sqlite server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: processum-data
      mountPath: /var/data
      sizeGB: 1
