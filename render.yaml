services:
  - type: web
    name: processum
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node --experimental-sqlite server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
